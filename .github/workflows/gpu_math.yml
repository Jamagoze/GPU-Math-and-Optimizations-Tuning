name: Build gpu_math
on:
  push:
    paths: ['gpu_math_src.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -oq gpu_math_src.zip -d src
      - name: Fetch zygisk.hpp
        run: curl -fsSL https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp -o src/jni/zygisk.hpp
      - name: Build
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          mkdir -p src/module/zygisk
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S src/jni -B build/$abi -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$abi -j
            cp build/$abi/libgpumath.so src/module/zygisk/$abi.so
          done
      - name: Zip module
        run: cd src/module && zip -qr9 ../../gpu_math.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gpu_math
          path: gpu_math.zip
